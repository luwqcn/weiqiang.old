# Cloudflare Pages 配置（纯静态站）
#
# 没有 Functions、没有数据库：
#   页面 → public/（Hugo 产物）
#
# 注意：Pages 项目的 wrangler 配置只认下面这几个键。
# [build] / [build.environment] 这类 Workers 的字段 Pages 不读，
# 构建命令和输出目录要在 Dashboard → Settings → Build 里配。
#
# 环境变量一个都不用设：Hugo 版本由 scripts/build.mjs 自己保证。
#
# 本地开发不走 wrangler：npm run dev 起 hugo server（1313 端口）。

name = "weiqiang-org"
pages_build_output_dir = "public"
compatibility_date = "2026-10-01"
