# ===========================================================================
# 危墙 · weiqiang.org
#
# 这个文件是主题能力的完整演示。重构自 Emacs + Org-Mode 生成的原站。
# 想改栏目、主页、评论、评论模板，基本都只需要动这个文件。
# ===========================================================================

baseURL = "https://weiqiang.org/"
title = "危墙"
theme = "SimpleW"

locale = "zh-CN"
defaultContentLanguage = "zh-cn"
timeZone = "Asia/Shanghai"
enableRobotsTXT = true
summaryLength = 60

# ---------------------------------------------------------------------------
# 链接形式 —— 干净链接（pretty URL）
#
# uglyURLs = false（Hugo 默认）让页面落到目录里的 index.html：
#
#   content/zh/2026-07-05-rensheng-yiyi.org  →  /zh/2026-07-05-rensheng-yiyi/
#
# 目录结构与 content/ 一一对应，因此不需要 [permalinks]：默认规则已经给出
# 同样的结果，少一处配置就少一处要维护的地方。若个别栏目想换路径，再单独加
# [permalinks] 覆盖即可（注意别在 pattern 里写 .html）。
#
# 例外：/zh/ 网志按日期命名，走下面 [permalinks] 的「栏目/年份/slug/」，
# 地址里不再挂那串日期。（原 /zj/ 支教目录已取消并入 /zh/，见下面结集说明。）
#
# 从 /zh/xxx.html 迁过来时，站外反链会 404 —— 需要在服务器（nginx / Cloudflare
# 等）配 rewrite 把 .html 请求 301 到去掉后缀的路径，或保留旧路径做重定向页。
# ---------------------------------------------------------------------------
uglyURLs = false

# ---------------------------------------------------------------------------
# 生产输出
#
# 压缩开关写进配置而不只放在 scripts/build.sh：换到 CI、Cloudflare Pages
# 或别的机器直接运行 `hugo`，HTML / CSS / JS / XML 仍会自动压缩。
# ---------------------------------------------------------------------------
[minify]
  minifyOutput = true

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML"]
  term = ["HTML"]

[taxonomies]
  # 标签就用 Hugo 惯例的 tags。Org 时代的 #+FILETAGS 与 #+KEYWORDS 已经在
  # 迁移时合并成 front matter 里的 `tags`（scripts/org-to-md.py），
  # 所以这里不再注册 filetags / keywords 两套。
  tag = "tags"
  category = "categories"
  # 结集（series）：文章 front matter 里写 `series = "ws"` 即归入该结集。
  # 与栏目（/zh/ /bc/ …）是两条线：栏目管「放哪儿」，结集管「属于哪一堆」。
  # 老的 /zj/ 支教目录已并入 /zh/，靠 series = "zj" 重新聚起来。
  series = "series"

# ---------------------------------------------------------------------------
# 标签地址统一成 /tags/<词>/
#
# tags 分类法默认就落在 /tags/，本来不用写；这里显式指定是为了防止以后改
# 配置时地址漂移，也让「对外地址是 /tags/ 而不是别的」这件事有个书面的地方。
# 列表页由 content/tags/_index.md 提供。categories 走默认的 /categories/。
# ---------------------------------------------------------------------------
[permalinks]
  tags = "/tags/:slug/"
  # 网志类栏目：栏目 / 年份 / slug
  #   2026-07-05-rensheng-yiyi.org  →  /zh/2026/rensheng-yiyi/
  # 年份取文章的 #+DATE:，slug 取文件名去掉「YYYY-MM-DD-」那一段。
  #
  # ⚠️ :slug 的坑：文章没写 slug 时，Hugo 会拿 **中文标题** 顶上，地址会变成
  #    /zh/2026/人生无意义/。所以凡是走 permalinks 的栏目，每篇都必须有
  #    #+SLUG:（Org）/ slug:（Markdown）—— scripts/gen-slugs.py 就是干这个的，
  #    新文章用 hugo new 建会自动带上（见 archetypes/default.md）。
  #    不想挂年份的栏目（/xy/ /bc/ /yue/）不用管，它们不在下面这张表里，
  #    仍按默认规则取文件名。
  zh = "/zh/:year/:slug/"
  # 结集页不要在这里写 [permalinks]：`:slug` 会取 _index.md 的标题（往事如烟），
  # 地址变成 /series/往事如烟/。不写就是 Hugo 默认的 /series/<key>/（/series/ws/），
  # 与文章 front matter 里的 series = "ws" 对得上。

# ---------------------------------------------------------------------------
# Markdown 渲染 —— 这两项必须写在站点配置里
#
# 主题里的 [markup] 不会合并过来（实测 Hugo 0.166 只合并主题的 [params]），
# 所以站点必须自己声明。两者缺一都会出问题：
#
#   unsafe = true        内容里的内联 HTML 会被整段丢弃。Org-Mode 迁移过来的
#                        文章常带 <span class="section-number-2">、<b> 之类，
#                        不开这个就会静默丢内容。
#   noClasses = false    Chroma 输出 class 而非内联样式，主题的 chroma.css
#                        才能跟随深浅色。代码块（```…```）由主题的 render
#                        hook 强制处理，这一项是为了 {{< highlight >}} shortcode。
#
#   attribute = true     内容已从 Org 转成 Markdown（scripts/org-to-md.py），
#                        标题写成 `## 标题 {#headline-3}` 才能沿用 go-org 原来
#                        的 id —— 目录、#锚点、外链不会因为换格式而失效。
#                        不开这一项，{#…} 会被当成标题文字印在页面上。
# ---------------------------------------------------------------------------
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.parser]
      attribute = true
  [markup.goldmark.table]
    # 表格语法（Org 的 |---+---| 表格转成这个）
    enabled = true
  [markup.highlight]
    noClasses = false
    lineNos = false
    guessSyntax = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4
    ordered = false

# 相关文章按标签、分类和年份计算；标签相同的文章优先。
[related]
  threshold = 20
  includeNewer = true
  toLower = true
  [[related.indices]]
    name = "tags"
    weight = 110
  [[related.indices]]
    name = "categories"
    weight = 80
  [[related.indices]]
    name = "date"
    weight = 10
    pattern = "2006"

# ---------------------------------------------------------------------------
# 站点参数
# ---------------------------------------------------------------------------
[params]
  author = "LOWEJAN"
  since = 2008
  description = "耕读传家久，诗书继世长。采菊桑林下，江南半農夫。"
  keywords = ["危墙之下", "村野闲居", "桑下居", "行止齋", "中医", "传统文化", "手作", "围墙里"]
  dateFormat = "2006-01-02"

  # 浏览器与分享卡片的站点级兜底。单篇写 cover/images 时仍优先用单篇图。
  themeColor = "#9f4942"
  ogImage = "/images/default.jpg"
  webmanifest = "/images/site.webmanifest"
  appleTouchIcon = "/images/apple-touch-icon.png"

  # 列表页（分类页）默认风格：
  #   calendar  按年折叠 + 年度日格热力图 + 「MM/DD 标题」紧凑行
  #   grouped   按年分组 + 虚线引导线（原站观感）
  #   cards     卡片
  #   plain     纯链接
  # 单个栏目可以在 [[params.sections]] 里用自己的 style 覆盖它。
  sectionStyle = "calendar"

  # 列表页默认收录范围：recursive（含子目录）| direct（仅本层）
  listScope = "recursive"

  # light = 完全沿用原站观感（默认）
  # auto  = 跟随系统深浅色，并在导航栏出现切换按钮
  colorScheme = "auto"

  # 站点标志：assets/images/logo.svg 会被内联，随主题色变化
  [params.brand]
    icon = "images/logo.svg"
    # text = "危墙"     # 想在图标旁显示文字就打开这行

  [params.header]
    showHome = true
    sticky = false
    navAnchor = true
    extraLinks = [
      # uglyURLs 下 RSS 落在 /index.xml（各栏目还有 /zh/index.xml 等）
      { name = "订阅", url = "/index.xml" },
    ]

  [params.footer]
    title = "本站导航"
    # 底部那行日期（关掉就设 false）：
    #   文章页    —— 写「本页最近更新：…」，日期按这个优先级取：
    #                ① 文件头的 #+LASTMOD / lastmod
    #                ② git 里最后一次**动过正文**的提交日期
    #                   （scripts/gen-lastmod.py 生成的 data/lastmod.json；
    #                     补 slug 那种整批刷一遍的提交不算修改）
    #                ③ 都没有才回退到发布日期
    #   其它页面  —— 写「本站最后更新: …」，取全站最新一篇内容的日期
    #
    # 想手动指定某页的更新时间，在文件头写一行就行（Org 实测有效）：
    #     #+LASTMOD: 2026-10-01        （Markdown 用 lastmod: 2026-10-01）
    #
    # 没开 enableGitInfo：本站 git 仓库是 2026-10-06 才建的，几百篇老文章
    # 是那一次整体导入的，开了会让它们统一显示成那天，反而更假。
    showLastmod = true
    toTop = true
    # 额外的页脚信息行，支持 {lastmod} {year} {author} {since} {title} 占位符
    infoLines = [
      "本站内容若非注明皆为原创，版权保留，详见<a href=\"/about/\">关于</a>页。",
    ]

  # -------------------------------------------------------------------------
  # 栏目注册表 —— 增加或删除分类，只改这一段
  #
  #   key         必填，同时对应 content/<key>/ 目录
  #   name        导航与页面标题
  #   subtitle    副标题（如斋号）
  #   description 分类页简介
  #   style       calendar（按年折叠+日格热力图）| grouped（按年分组）
  #               | cover（通栏大卡：底图做背景，日期/标题/描述压在图上，
  #                 一栏一篇，不分列）
  #               | cards（带摘要的方框卡片）| plain（纯链接）；不写则用全局 sectionStyle
  #   cover       cover 样式专用的默认底图：文章自己没写 cover / #+COVER:
  #               正文里也没图时，整栏统一用这张。不写则画一块带栏目首字的占位图。
  #   order       越小越靠前
  #   nav         是否出现在顶部导航
  #   footer      是否出现在页脚导航
  #   home        是否出现在主页栏目卡片
  #
  # 下面这几个是「文章页组件」的按栏目开关，只写要改的，不写就沿用默认：
  #   comments    文章末尾的评论框（默认：栏目里的文章开，独立页面关）
  #   related     「相关文章」（默认：栏目里的文章开）
  #   prevNext    「上一篇 / 下一篇」（默认：栏目里的文章开）
  #   hideList    该栏目页不列文章列表，只当说明/导览页用
  #   toc         该栏目页挂右侧浮动目录
  #
  # 优先级：单篇 front matter > 这里的按栏目设置 > [params.post] 全局设置。
  # key 写目录名（"xy"）管整个栏目，写路径（"xy/dian"）只管那一层，
  # 后者更具体，会覆盖父栏目。
  # 注意：_index 用 Org 写的话，自定义开关读不到，只能写在这里。
  # -------------------------------------------------------------------------
  [[params.sections]]
    key = "zh"
    name = "手记"
    url = "/zh/"
    description = "个人网志，纪录生活经历、个人感悟、阅读笔记等等。多为个人碎语，偶尔思考一番，收录个人文字，让文字见证存在。"
    style = "calendar"
    order = 10
    nav = true
    footer = true
    home = false

  [[params.sections]]
    key = "bc"
    name = "本草"
    url = "/bc/"
    description = "生于江南，寻觅本草江湖。"
    style = "cover"
    cover = "/images/default.jpg"
    order = 20
    nav = false
    footer = true
    home = true

  [[params.sections]]
    key = "yue"
    name = "乐记"
    url = "/yue/"
    description = "《乐记》关于音、乐的描述，以及个人古琴曲的辑录。"
    style = "cover"
    # 乐记的栏目默认底图：竹林七贤（阮籍《酒狂》）水墨意境图，
    # 1536×591（2.6:1，与卡片比例一致），刻意让画面主体集中在中上部、
    # 下方留出可压白字的空间。换图直接改这里，或单篇写 #+COVER:。
    cover = "/images/yue-jiukuang.jpg"
    # 万一有文章既没自己的底图、又赶上这张图不合适，占位块用这个字
    coverGlyph = "樂"
    order = 30
    nav = false
    footer = true
    home = true

  [[params.sections]]
    key = "xy"
    name = "习艺"
    url = "/xy/"
    description = "此处存放自己感兴趣的一些领域的内容，包括自己整理、思考的，别处摘录的，读书笔记、评论等等。希望给自己的人生找点乐子，多志于鸟兽虫鱼，此为个人兴趣与话题收集地。"
    style = "plain"
    order = 40
    nav = false
    footer = true
    home = true
    # 习艺是个导览页：_index.org 的正文已经把中医/古籍/太极/编程等话题
    # 和链接写清楚了，下面再挂一串全部文章纯属重复，故不列文章列表。
    hideList = true
    # 正文里的话题标题多，给它单独挂一个右侧目录（默认只有单页才有）
    toc = true
    # 习艺是「资料堆」而不是日记：读完一篇不太会想看上一篇/下一篇，
    # 相关文章也多半是同栏目的摘录，意义不大，只留评论。
    # 想恢复就把这两行删掉或改成 true。
    related = false
    prevNext = false

  # -------------------------------------------------------------------------
  # 结集（series）—— 不是栏目，是「同一堆文章」的横向聚合
  #
  # 支教目录 /zj/ 已经取消：那些文章搬进 /zh/，靠 front matter 里的
  # `series = "zj"` 重新聚起来。三条结集的标题、简介、状态徽章、排序都写在
  # content/series/<key>/_index.md 里（Hugo 原生做法），主页的结集区块和
  # /series/ 索引页都从那里读。
  # 这里只留一个「进页脚导航」的入口：
  # -------------------------------------------------------------------------
  [[params.sections]]
    key = "series"
    name = "结集"
    url = "/series/"
    order = 50
    nav = false
    footer = true
    home = false

  # 普通页面也可以进导航（不是 section，只是链接）
  [[params.sections]]
    key = "about"
    name = "关于"
    url = "/about/"
    order = 90
    nav = true
    footer = true
    home = false

  [[params.sections]]
    key = "links"
    name = "收藏"
    url = "/links/"
    order = 95
    nav = false
    footer = true
    home = false

  # -------------------------------------------------------------------------
  # 主页 —— 积木式，顺序即从上到下的顺序
  # 类型：hero | recent | list | sections | taxonomy | markdown | columns | html
  # -------------------------------------------------------------------------
  [params.home]
    showContent = true     # 先渲染 content/_index.md 的正文
    showTitle = false

    [[params.home.blocks]]
      # hero 是开场白，始终渲染在 content/_index.md 正文之上（即页面文字最顶端）。
      # 想让它回到正文之后，加一行 position = "bottom"；
      # 别的块想提到正文之上，加 position = "top"。
      type = "hero"
      title = "**欢迎！**"

    [[params.home.blocks]]
      type = "recent"
      title = "最近更新"
      count = 5
      group = false
      style = "grouped"
      #more = { name = "网志", url = "/zh/" }

    [[params.home.blocks]]
      type = "sections"
      title = "栏目"
      showCount = true
      only = []
      exclude = []

    [[params.home.blocks]]
      # 结集：/series/ 下那几堆文章（往事如烟 / 桑下書集 / 支教）。
      # 老的 /zj/ 支教目录已经取消，改由 series = "zj" 聚拢，故从「栏目」里
      # 撤下、在这儿单独列。内容与排序读 content/series/<key>/_index.md。
      type = "series"
      title = "结集"
      showCount = true
      showDesc = true
      # only    = ["ws", "shuji"]   # 只列这几条
      # exclude = ["zj"]            # 或者排除这几条

    # [[params.home.blocks]]
    #   type = "taxonomy"
    #   title = "标签"
    #   taxonomy = "tags"        # 本站标签分类法（对外 /tags/）；categories 亦可
    #   limit = 20
    #   sort = "count"

    # [[params.home.blocks]]
    #   type = "columns"
    #   title = "近来常做的三件事"
    #   items = [
    #     { title = "读书", content = "…" },
    #     { title = "写字", content = "…" },
    #     { title = "侍弄草木", content = "…" },
    #   ]

  # -------------------------------------------------------------------------
  # 评论 —— provider 换成任意一个即可；也可用 template 指向自己的模板
  #
  # 当前启用 Twikoo。换引擎只改 provider 一行，下面各家的配置块都留着，
  # 填好值随时能切回去。
  # -------------------------------------------------------------------------
  [params.comments]
    enabled = true
    provider = "twikoo"        # artalk | giscus | disqus | waline | twikoo | utterances | custom | none
    title = "评论/留言"
    showDivider = true
    # 评论框默认收起来，读者点标题右边的按钮才展开。
    # 头条那行「评论/留言（N） [查看评论]」始终可见，展开后按钮变「收起评论」。
    # 想让评论框像从前一样一开始就铺开，把这里改成 false；
    # 单篇想单独改，在 front matter 写 `collapse = false`。
    # 没启用 provider（none）时这一项无效，本来就没有框可收。
    collapse = true
    # template = "comments/my-provider.html"   # 自定义评论模板：写成 partial 路径
    # customRaw = """<div id="mine"></div><script>…</script>"""

    # -------------------------------------------------------------------
    # Twikoo（当前启用）
    #   envId  必填。Vercel / Netlify / Railway 自建实例的完整地址，
    #          或腾讯云开发给出的环境 ID（形如 xxx-1a2b3c4d5e6f）。
    #   cdn    可选，默认走 jsDelivr。国内访问不稳可换成
    #          https://unpkg.com/twikoo@1.6.44/dist/twikoo.min.js
    # -------------------------------------------------------------------
    [params.comments.twikoo]
      # envId 必须写「完整地址」，Netlify 部署一定要带上函数路径。
      # 只写 https://cmt.weiqiang.org 的话，Twikoo 会去请求站点首页，
      # Netlify 返回 404 的 HTML（不带 CORS 头），浏览器就报
      # 「请求被跨域策略拦截、status 0」——看着像跨域问题，其实是地址填短了。
      envId = "https://cmt.weiqiang.org/.netlify/functions/twikoo"
      lang = "zh-CN"
      cdn = "https://cdn.jsdelivr.net/npm/twikoo@2.0.12/dist/twikoo.min.js"

    # 下面几组是备选引擎，切换 provider 时把对应值填上即可。
    [params.comments.artalk]
      # 旧站（Org-Mode 导出版）页面上写的是 https://cmt.weiqiang.org；
      # 评论数据在那台实例上。换成新实例前先别改这里，否则等于换了个空库。
      server = "https://art.weiqiang.org"
      site = "危墙"
      locale = "zh-CN"
      cdn = "https://cdnjs.cloudflare.com/ajax/libs/artalk/2.9.1"
      pageKey = ""        # 留空 = 用页面路径；填 "legacy" = 交给 Artalk 自己判断
      # 评论按 key 存，旧站的 key 是当时的路径 /zh/xxx.html。漂亮 URL 之后页面
      # 路径变成 /zh/xxx/，直接用新路径会查出 0 条评论。开着 legacyKeys，先按
      # 旧 key 去取 —— 评论一条不少，只是 key 还写着旧地址。
      # 等后端数据真的改完（见 scripts/artalk-migrate.py），把它改回 false 即可。
      legacyKeys = true
      darkMode = "auto"
      showPV = true

    # 下面几组是备选引擎的示例配置，切换 provider 时把对应值填上即可。
    [params.comments.giscus]
      repo = "your-name/your-repo"
      repoId = "R_kgDOxxxxxxx"
      category = "Announcements"
      categoryId = "DIC_kwDOxxxxxxxx"
      mapping = "pathname"
      lang = "zh-CN"
      lightTheme = "light"
      darkTheme = "dark_dimmed"

    [params.comments.disqus]
      shortname = "your-shortname"

    [params.comments.waline]
      serverURL = "https://waline.example.org"
      lang = "zh-CN"
      pageview = false

    [params.comments.utterances]
      repo = "your-name/your-repo"
      issueTerm = "pathname"

  # -------------------------------------------------------------------------
  # 网络提及（Webmention）—— 评论区下面单独一块
  #
  # 跟上面评论是两条线：Twikoo 收本站访客的留言，这里收「别人在自己的
  # 站点 / Mastodon / Bluesky 上回应了这篇文章」时自动推过来的通知
  # （回复 / 提及 / 点赞 / 转发 / 收藏）。
  #
  # 为什么不能纯静态自己做：Hugo 生成的是静态 HTML，收不了别人发来的
  # POST，「接收」这一环必须外置。这里走 webmention.io 的托管端点——
  # 本站只负责在 <head> 里声明端点（让别人发现），以及把它的公开 API
  # 结果画到评论区。样式 themes/SimpleW/assets/css/webmention.css，
  # 模板 themes/SimpleW/layouts/partials/comments/webmention.html。
  #
  # 上线前要做的几件事：
  #   1. relMe —— 站点上要有 rel="me" 指向一个能回链的档案。webmention.io
  #      登录走 IndieAuth 认领域名，就是靠它找到你的 GitHub / Mastodon /
  #      Bluesky 主页；那个主页里也要有链回本站的链接（反过来才算验证过）。
  #   2. 去 https://webmention.io 用 weiqiang.org 登录一次，端点才开始
  #      真的收东西（登录前推过来的会被丢掉）。
  #   3. 想让社交平台的回复也汇进来：去 https://brid.gy 关联你的
  #      Mastodon / Bluesky 账号，然后在这边每篇文章的 front matter 里写
  #      syndication = ["那条帖子的地址"]，head 会输出 rel="syndication"，
  #      Bridgy 靠它把帖子对回文章、再把帖下的回复变成 webmention。
  #
  # 单篇想关掉，front matter 写 `webmention: false`。
  # -------------------------------------------------------------------------
  [params.webmention]
    # 关掉就整块不输出（head 里的端点声明、样式、前端请求全都没有）
    enabled = true
    domain = "weiqiang.org"
    title = "来自网络的提及"
    # 没有提及时给一句说明；关掉的话，没提及就整块不显示
    intro = true

    # webmention.io 的 API token。默认留空 —— 公开提及不带 token 也能读到，
    # 而填了它会明文出现在页面源码里，谁都能拿去读你的提及列表。
    # 只有想把「非公开」提及也显示出来时才需要填。
    token = ""

    # 端点地址。留空即用 webmention.io 给这个域名的默认端点。
    # 将来换成自己搭的接收服务，改这两行即可，模板不用动。
    endpoint = ""       # 默认 https://webmention.io/<domain>/webmention
    pingback = ""       # 默认 https://webmention.io/<domain>/xmlrpc

    # 读者提交 Webmention 的入口地址。留空即用 https://webmention.io/<domain>/，
    # 页面上会拼成 https://webmention.io/<domain>/?target=<本文地址> 再链过去；
    # webmention.io 的表单会自己带上 target，读者只要填「我那篇回应文章的地址」。
    # 将来换自建接收端，这里填那个端的提交页地址。
    form = ""

    # 站点身份：rel="me" 指向的档案，全站每一页的 <head> 都会输出。
    # IndieAuth（webmention.io / IndieLogin 登录）抓主页找的就是这些。
    #
    # 两种写法：
    #   · 纯字符串 —— 普通身份声明，输出 <link rel="me" href="…">
    #   · map       —— 可带 authn，输出 <link rel="me authn" href="…">
    #
    # ⚠️ IndieLogin 的规则：页面上只要有任意一条 rel="me" 带 authn，
    #    登录时就**只认带 authn 的**。邮箱最稳（无第三方账号可失效，
    #    验证码直接发到信箱），所以拿它当带 authn 的主力。
    #
    # 主站那两条同时也在 layouts/partials/custom-head.html 里按 /about/
    # 输出过 —— 这里改成全站后，custom-head 要收敛，避免同页重复声明。
    relMe = [
      { href = "mailto:lu@weiqiang.org", authn = true },
      { href = "https://github.com/shujiaccn" },
    ]

  # -------------------------------------------------------------------------
  # 其它
  # -------------------------------------------------------------------------
  [params.post]
    # date | lastmod | section | categories | readingTime | wordCount
    # （标签单独显示在正文末尾，见下方「标签」说明）
    # 排出来是这样：2026-10-07 · 往事如烟 · 共 640 字 · 阅读约需 2 分钟
    # （series 那一项只在文章写了 series = "…" 时才出现，不想显示就删掉它）
    meta = ["date", "series", "wordCount", "readingTime"]
    # 文章末尾的「上一篇 / 下一篇」导航，不需要就设成 false
    # 站点根目录下的独立页面（关于 / 收藏 / SiteLog）永远不会显示
    # 按栏目关：[[params.sections]] 那条写 prevNext = false
    showPrevNext = true
    # 「相关文章」最多显示几篇；设为 0 可关闭，默认 5
    # 整块关掉：related = false；按栏目关写 [[params.sections]] 的 related
    relatedCount = 5
    # related = false       # 全站都不显示「相关文章」
    # 中文阅读速度（字/分钟），用于估算「阅读时间」，默认 400
    wordsPerMinute = 300
    # 正文标题怎么区分层级：
    #   false（默认）→ 形状分层：h2 左侧砖红竖条、h3 实心菱形、h4 空心圆，
    #                  越往下越轻。贴这个纸感主题，增删章节也不用重排号。
    #   true          → Org 那套数字编号 1 / 1.1 / 1.1.1，右侧目录同步带号。
    # 单篇想单独改，在 front matter 里写 headingNumbers = true / false。
    # 两种模式都会跳过「脚注 / 注释」这类容器标题。
    headingNumbers = false

  [params.toc]
    enabled = true
    open = true
    # 栏目/列表页默认没有右侧目录。想让某个栏目页单独挂一个，
    # 在它的 _index 里写 `showToc: true`（Org 用 `#+SHOWTOC: true`）；
    # 想全部栏目页都挂，把下面这行打开（逐页开关优先）。
    # onListings = true

  [params.pagination]
    enabled = false     # 与原站一致：一页列全。改成 true 即分页。

  [params.social]
    rss = true

  # -------------------------------------------------------------------------
  # 分类页「calendar」样式 —— 年度折叠 + 日格热力图
  #
  # 热力图每一格是一天：横向是周（第 1 周…第 53 周），纵向是星期；颜色深浅
  # 按当日发文篇数分档。悬停显示当天篇数与标题，点击跳到当天第一篇。
  # 把 heatmap 关掉，就退化成「年份折叠 + MM/DD 行列表」。
  #
  # 主题自身有一份相同的默认值，这里展开写出来只是方便你直接改。整块删掉
  # 也不影响运行。
  # -------------------------------------------------------------------------
  [params.listing.calendar]
    heatmap = true          # 画不画年度日格
    palette = "accent"      # accent（赭红，沿用本站配色）| ink（参考站的青灰）
    weekStart = "monday"    # monday（中文日历习惯）| sunday（参考站原样）
    levels = [1, 2, 4, 7]   # 当日达到几篇进入第 1/2/3/4 档；可增可减
    monthAxis = true        # 月份轴（1月…12月）
    weekdayAxis = true      # 星期轴（一/三/五）
    openYears = 1           # 默认展开最近几年；-1 全部展开，0 全部折叠
    dateFormat = "01/02"    # 行首日期，Go 写法
    showCount = true        # 年份与页面标题后面跟「· N 篇」
    maxTitles = 12          # 单元格悬浮提示里最多列几篇标题

  # -------------------------------------------------------------------------
  # 结集（series）—— /series/ 索引页与各结集页的开关
  #
  # 每一条的「名字 / 简介 / 状态 / 排序」写在
  # content/series/<key>/_index.md 的 front matter 里：
  #
  #     title = "往事如烟"
  #     description = "2016 年前网志存档，不再更新。"
  #     status = "已归档"
  #     order = 10
  #
  # 下面这张表只是兜底：某个 key 一时没有 _index.md，才从这里取名和简介。
  #
  # ⚠️ 排序要改 content/series/<key>/_index.md 里的 order：那份 front matter
  #    优先级高于这里（见 func/series-meta.html），改这里对已有 _index.md 的
  #    结集不起作用——order、name、description、status 都是如此。
  #
  #   status  徽章文案（已归档 / 进行中 …），留空就不显示徽章；
  #           卡片左侧那道书脊的颜色也跟着它走（进行中 = 绿，其余 = 赭红）
  #   order   越小越靠前（生效位置见上面那条警告）
  #   style   series（编号卷次，默认）| grouped | calendar | cards | plain
  # -------------------------------------------------------------------------
  [params.series]
    style = "series"        # 结集页默认列表样式
    showCount = true        # 索引页卡片上显示「N 篇」
    showSpan = true         # 显示时间跨度（2008 – 2016）

    [[params.series.items]]
      key = "ws"
      name = "往事如烟"
      description = "2016 年前网志存档，不再更新。"
      status = "已归档"
      order = 10

    [[params.series.items]]
      key = "zj"
      name = "支教"
      description = "2010 年的支教旧文，留作存档。"
      status = "已归档"
      order = 20

    [[params.series.items]]
      key = "shuji"
      name = "桑下書集"
      description = "桑下書集相关，记录書集进展。"
      status = "进行中"
      order = 30
