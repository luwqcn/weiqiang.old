{{- /* baseof.html — the document shell every template inherits. */ -}}
<!DOCTYPE html>
<html lang="{{ site.Params.langCode | default "zh-CN" }}">
<head>
{{ partial "head.html" . }}
</head>
<body class="kind-{{ .Kind }}{{ with .Type }} type-{{ . }}{{ end }}{{ if .IsHome }} is-home{{ end }}{{ with .Params.bodyClass }} {{ . }}{{ end }}">

<a class="skip-link" href="#content">{{ i18n "skipToContent" | default "跳到正文" }}</a>

{{ partial "header.html" . }}

<main id="content" class="content" tabindex="-1">
{{- block "main" . }}{{ end -}}
</main>

{{ partial "footer.html" . }}
{{ partial "scripts.html" . }}

</body>
</html>
