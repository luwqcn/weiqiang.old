{{- /*
  partials/scripts.html — end-of-body scripts.

  Hooks:
    layouts/partials/custom-js.html   a template you own
    params.customScripts              raw <script>…</script> markup
*/ -}}
{{- $js := resources.Get "js/main.js" -}}
{{- if $js -}}
  {{- $js = $js | minify | fingerprint -}}
  <script src="{{ $js.RelPermalink }}" integrity="{{ $js.Data.Integrity }}" defer></script>
{{- end -}}

{{- /*
  评论区是一个标签页组，切换靠原生 radio + <label> + CSS 兄弟选择器，**不需要
  任何脚本**（原来的 comments.js 展开脚本已删）。需要 JS 的两件事都内联在各自
  的面板模板里、跟着模板一起走，所以这里不用条件加载：
    · 评论标签：comments/twikoo.html 在标签被选中后延迟初始化 Twikoo
    · 提及标签：comments/webmention.html 在标签被选中后才去拉 webmention.io
*/ -}}

{{- if templates.Exists "partials/custom-js.html" }}
{{ partial "custom-js.html" . }}
{{- end }}
{{- with site.Params.customScripts }}
{{ . | safeHTML }}
{{- end }}
